# /etc/nginx/sites-available/resume
#
# 装好后：
#   ln -s /etc/nginx/sites-available/resume /etc/nginx/sites-enabled/resume
#   rm -f /etc/nginx/sites-enabled/default      # 去掉默认站点，否则它会抢 80 端口
#   nginx -t && systemctl reload nginx
#
# 注意把下面的 server_name 换成你的域名或公网 IP。

server {
    listen 80;
    listen [::]:80;

    # 有域名就写域名，只用 IP 访问就写 IP
    server_name resume.example.com;

    root /opt/resume/web;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 简历数据必须每次拿最新的，否则你改了后台访客看到的还是旧内容
    location = /data/data.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 上传的图片文件名带随机串，内容不会变，可以放心长缓存
    location /uploads/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 只有 API 请求转发给 Node，其余全部由 nginx 直接发文件
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传走 base64，体积约 1.33 倍。要能装下 .env 里的 MAX_PDF_MB（默认 10MB → 约 13.3MB）
        client_max_body_size 20m;
    }

    # 静态文件（HTML / CSS / JS）每次回源校验。
    #
    # 不给这个头的话浏览器按启发式规则自己估缓存期 —— 大致是「距文件上次修改时间的
    # 10%」。一个几个月没动过的 main.js，估出来就是好几天的缓存，部署完访客直接拿
    # 缓存里的旧文件、根本不回源。而这个站点的 HTML 和 JS 是一起改的（改版时类名
    # 会大换），新 HTML 配旧 JS 就是整页白屏 —— 渲染函数在旧元素上抛错，下面全空。
    #
    # no-cache 不是「不缓存」，是「用之前先问一句」。nginx 会带 ETag / Last-Modified，
    # 没变就是 304，只多一个来回，对这个体量的站点可以忽略。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # 后台是私人页面，别让搜索引擎收录。
    # 这里必须把 Cache-Control 再写一遍：nginx 的 add_header 不继承 ——
    # 本层只要有一条自己的 add_header，上一层的就全丢了。
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
