# /etc/nginx/sites-available/resume
#
# 装好后：
#   ln -s /etc/nginx/sites-available/resume /etc/nginx/sites-enabled/resume
#   rm -f /etc/nginx/sites-enabled/default      # 去掉默认站点，否则它会抢 80 端口
#   nginx -t && systemctl reload nginx
#
# 注意把下面的 server_name 换成你的域名或公网 IP。

server {
    listen 80;
    listen [::]:80;

    # 有域名就写域名，只用 IP 访问就写 IP
    server_name resume.example.com;

    root /opt/resume/web;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 简历数据必须每次拿最新的，否则你改了后台访客看到的还是旧内容
    location = /data/data.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 上传的图片文件名带随机串，内容不会变，可以放心长缓存
    location /uploads/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 只有 API 请求转发给 Node，其余全部由 nginx 直接发文件
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传走 base64，体积约 1.33 倍。要能装下 .env 里的 MAX_PDF_MB（默认 10MB → 约 13.3MB）
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 后台是私人页面，别让搜索引擎收录
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri =404;
    }
}
