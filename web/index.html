<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历 · 作品集</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <script>
        // 主题必须在首次绘制之前定下来，所以这段内联在 <head> 里，而且要放在
        // 样式表前面。main.js 在 <body> 末尾，等它跑起来页面已经按 :root 的浅色
        // 画过一帧了 —— 深色用户每次刷新都闪一下白屏。style.css 里没有
        // prefers-color-scheme 兜底（只有 [data-theme="dark"]），所以这里不设的话
        // 系统深色也一样闪。
        // 规则和 main.js 里那份一致：存过的优先，没存过跟随系统。
        // 隐私模式下 localStorage 可能直接抛异常，整段包一层 try。
        (function () {
            var t;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'dark' && t !== 'light') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <!-- 字体走系统栈（见 style.css 的 --font-sans），不引 Google Fonts：
         那个 <link> 是阻塞首屏渲染的，而 fonts.googleapis.com 在国内基本连不上，
         访客会先白屏一段。另外这两款字体都没有中文字形，中文本来就走系统回退，
         去掉它只影响拉丁字母和数字。 -->
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <div class="bg-pattern">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
    </div>
    <div class="bg-glow"></div>

    <nav class="topbar">
        <a href="#" class="logo" id="nav-logo">Online Resume</a>
        <!-- 顺序跟着页面从上到下的板块走：关于我 → 作品 → 视频 → 技能。
             「管理」不是页面板块，是跳后台的，所以固定在最后。 -->
        <ul class="nav-links">
            <li><a href="#about">关于我</a></li>
            <li><a href="#games">作品</a></li>
            <li><a href="#videos">视频</a></li>
            <li><a href="#skills">技能</a></li>
            <li><a href="./admin.html">管理</a></li>
        </ul>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
            <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </nav>

    <!-- 顶部横幅。底色就是页面底色，靠一圈纯 CSS 画的几何图形做点缀，
         没有任何背景图和外部资源（这个项目刻意不带静态资源依赖）。
         下面的文字会被 main.js 用 data.json 覆盖，写在这里只是禁用 JS 时的兜底。 -->
    <section class="banner">
        <!-- 纯装饰，对读屏器隐藏。立体的那个方块由三个面拼出来，见 style.css -->
        <div class="banner-deco" aria-hidden="true">
            <span class="deco deco-blob deco-blob-a"></span>
            <span class="deco deco-blob deco-blob-b"></span>
            <span class="deco deco-cube">
                <i class="cube-top"></i><i class="cube-left"></i><i class="cube-right"></i>
            </span>
            <span class="deco deco-ring"></span>
            <span class="deco deco-tri"></span>
            <span class="deco deco-square"></span>
            <span class="deco deco-dots"></span>
        </div>
        <div class="banner-inner">
            <span class="banner-tag" id="banner-tag"></span>
            <p id="banner-subtitle"></p>
            <a href="#about" class="banner-cta">了解更多</a>
        </div>
    </section>

    <!-- 两栏主体。左栏是粘性个人卡（内容全部由 main.js 的 renderProfileCard 生成），
         右栏是各板块。负 margin 让它上提盖住横幅底部，见 style.css 的 .layout。 -->
    <div class="layout">
        <!-- 「关于我」的正文也在左栏卡片里（见 main.js 的 renderProfileCard），
             所以导航里「关于我」指向这里 -->
        <aside class="profile-col" id="about">
            <div class="profile-card" id="profile-card"></div>
        </aside>

        <main class="content-col">
            <!-- 板块标题：文字 ——— 编号。编号是写死的，四个板块不会变 -->
            <section class="block" id="target">
                <h2 class="block-title"><span>求职意向</span><i class="block-rule"></i><span class="block-num">01</span></h2>
                <div id="job-target" class="job-target"></div>
            </section>

            <section class="block" id="games">
                <h2 class="block-title"><span>游戏作品集</span><i class="block-rule"></i><span class="block-num">02</span></h2>
                <div class="grid" id="games-grid"></div>
            </section>

            <section class="block" id="videos">
                <h2 class="block-title"><span>视频展示</span><i class="block-rule"></i><span class="block-num">03</span></h2>
                <div class="video-grid" id="videos-grid"></div>
            </section>

            <section class="block" id="skills">
                <h2 class="block-title"><span>技能</span><i class="block-rule"></i><span class="block-num">04</span></h2>
                <div class="skills-list" id="skills-grid"></div>
            </section>
        </main>
    </div>

    <footer>
        <p class="copyright">© <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</p>
    </footer>

    <!-- Game Modal -->
    <div class="modal-overlay" id="game-modal" onclick="closeModal(event)">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title"></h3>
                <button class="modal-close" onclick="closeModal(event, true)">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="./assets/main.js"></script>
</body>
</html>
